<!DOCTYPE html>
<html>
<head>
    <title>Manage Products</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#fff9e6;
        }

        /* Header */
        header{
            background:linear-gradient(135deg,#ff9800,#ffd54f);
            color:white;
            text-align:center;
            padding:40px;
        }

        header h1{
            font-size:45px;
        }

        header p{
            font-size:18px;
        }

        /* Navigation */
        nav{
            background:#ff9800;
            text-align:center;
            padding:15px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-weight:bold;
            transition:0.3s;
        }

        nav a:hover{
            color:black;
        }

        /* Container */
        .container{
            width:90%;
            margin:auto;
            padding:30px;
        }

        h2{
            text-align:center;
            color:#ff9800;
            margin-bottom:25px;
        }

        table{
            width:100%;
            background:white;
            border-collapse:collapse;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0px 4px 15px rgba(0,0,0,0.15);
        }

        th{
            background:#ff9800;
            color:white;
            padding:15px;
        }

        td{
            padding:15px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#fff3cd;
        }

        .btn{
            border:none;
            padding:10px 15px;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
            margin:3px;
        }

        .edit-btn{
            background:#28a745;
            color:white;
        }

        .delete-btn{
            background:#dc3545;
            color:white;
        }

        .add-btn{
            background:#ff9800;
            color:white;
            padding:12px 20px;
            margin-top:20px;
        }

        .btn:hover{
            opacity:0.8;
        }

        .button-container{
            text-align:center;
        }

        footer{
            background:#ff9800;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:30px;
        }

        @media(max-width:768px){

            nav a{
                display:block;
                margin:10px 0;
            }

            header h1{
                font-size:30px;
            }

            table{
                font-size:14px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📦 Manage Products</h1>
    <p>Manage Your Store Inventory</p>
</header>

<nav>
    <a href="seller-dashboard.html">Dashboard</a>
    <a href="manage-products.html">Products</a>
    <a href="add-product.html">Add Product</a>
    <a href="seller-orders.html">Orders</a>
    <a href="seller-profile.html">Profile</a>
    <a href="index.html">Logout</a>
</nav>

<div class="container">

    <h2>Product List</h2>

    <table>

        <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>Category</th>
            <th>Stock</th>
            <th>Actions</th>
        </tr>

        <tr>
            <td>Monkey Backpack</td>
            <td>₱550</td>
            <td>Bags</td>
            <td>20</td>
            <td>
                <button class="btn edit-btn">Edit</button>
                <button class="btn delete-btn">Delete</button>
            </td>
        </tr>

        <tr>
            <td>Monkey Plush Toy</td>
            <td>₱450</td>
            <td>Toys</td>
            <td>15</td>
            <td>
                <button class="btn edit-btn">Edit</button>
                <button class="btn delete-btn">Delete</button>
            </td>
        </tr>

        <tr>
            <td>Banana Chips</td>
            <td>₱85</td>
            <td>Snacks</td>
            <td>50</td>
            <td>
                <button class="btn edit-btn">Edit</button>
                <button class="btn delete-btn">Delete</button>
            </td>
        </tr>

    </table>

    <div class="button-container">
        <a href="add-product.html">
            <button class="btn add-btn">➕ Add Product</button>
        </a>
    </div>

</div>

<footer>
    <p>© 2026 Monkey & Banana Store | Manage Products</p>
</footer>

</body>
</html>
