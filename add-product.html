<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#fff9e6;
        }

        /* Header */
        header{
            background:linear-gradient(135deg,#ff9800,#ffd54f);
            color:white;
            text-align:center;
            padding:40px;
        }

        header h1{
            font-size:45px;
        }

        header p{
            font-size:18px;
        }

        /* Navigation */
        nav{
            background:#ff9800;
            text-align:center;
            padding:15px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-weight:bold;
            transition:0.3s;
        }

        nav a:hover{
            color:black;
        }

        /* Container */
        .container{
            width:90%;
            margin:auto;
            padding:30px;
        }

        h2{
            text-align:center;
            color:#ff9800;
            margin-bottom:25px;
        }

        .form-card{
            max-width:500px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 4px 15px rgba(0,0,0,0.15);
        }

        .input-box{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        .btn{
            width:100%;
            border:none;
            background:#28a745;
            color:white;
            padding:12px;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
            font-weight:bold;
        }

        .btn:hover{
            opacity:0.8;
        }

        footer{
            background:#ff9800;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:30px;
        }

        @media(max-width:768px){

            nav a{
                display:block;
                margin:10px 0;
            }

            header h1{
                font-size:30px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>➕ Add Product</h1>
    <p>Add New Items to Your Store</p>
</header>

<nav>
    <a href="seller-dashboard.html">Dashboard</a>
    <a href="manage-products.html">Products</a>
    <a href="add-product.html">Add Product</a>
    <a href="seller-orders.html">Orders</a>
    <a href="seller-profile.html">Profile</a>
    <a href="index.html">Logout</a>
</nav>

<div class="container">

    <h2>Add Product</h2>

    <div class="form-card">

        <input type="text"
               placeholder="Product Name"
               class="input-box">

        <br><br>

        <input type="number"
               placeholder="Price"
               class="input-box">

        <br><br>

        <input type="text"
               placeholder="Category"
               class="input-box">

        <br><br>

        <input type="number"
               placeholder="Stock Quantity"
               class="input-box">

        <br><br>

        <button class="btn">
            Save Product
        </button>

    </div>

</div>

<footer>
    <p>© 2026 Monkey & Banana Store | Add Product</p>
</footer>

</body>
</html>
