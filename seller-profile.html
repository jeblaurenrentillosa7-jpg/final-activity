<!DOCTYPE html>
<html>
<head>
    <title>Seller Profile</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#fff9e6;
        }

        /* Header */
        header{
            background:linear-gradient(135deg,#ff9800,#ffd54f);
            color:white;
            text-align:center;
            padding:40px;
        }

        header h1{
            font-size:45px;
        }

        header p{
            font-size:18px;
        }

        /* Navigation */
        nav{
            background:#ff9800;
            text-align:center;
            padding:15px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-weight:bold;
            transition:0.3s;
        }

        nav a:hover{
            color:black;
        }

        /* Container */
        .container{
            width:90%;
            margin:auto;
            padding:30px;
        }

        h2{
            text-align:center;
            color:#ff9800;
            margin-bottom:25px;
        }

        .profile-card{
            max-width:500px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 4px 15px rgba(0,0,0,0.15);
        }

        .profile-card p{
            font-size:18px;
            margin:15px 0;
        }

        footer{
            background:#ff9800;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:30px;
        }

        @media(max-width:768px){

            nav a{
                display:block;
                margin:10px 0;
            }

            header h1{
                font-size:30px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>👤 Seller Profile</h1>
    <p>Manage Your Store Information</p>
</header>

<nav>
    <a href="seller-dashboard.html">Dashboard</a>
    <a href="manage-products.html">Products</a>
    <a href="add-product.html">Add Product</a>
    <a href="seller-orders.html">Orders</a>
    <a href="seller-profile.html">Profile</a>
    <a href="index.html">Logout</a>
</nav>

<div class="container">

    <h2>Seller Profile</h2>

    <div class="profile-card">

        <p>
            <strong>Seller Name:</strong>
            Juan Seller
        </p>

        <p>
            <strong>Store Name:</strong>
            Monkey &amp; Banana Store
        </p>

        <p>
            <strong>Email:</strong>
            seller@example.com
        </p>

        <p>
            <strong>Contact:</strong>
            09123456789
        </p>

    </div>

</div>

<footer>
    <p>&copy; 2026 Monkey &amp; Banana Store | Seller Profile</p>
</footer>

</body>
</html>
