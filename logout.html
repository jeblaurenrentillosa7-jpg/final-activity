<!DOCTYPE html>
<html>
<head>
    <title>Logout</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#fff9e6;
        }

        /* Header */
        header{
            background:linear-gradient(135deg,#ff9800,#ffd54f);
            color:white;
            text-align:center;
            padding:40px;
        }

        header h1{
            font-size:45px;
        }

        header p{
            font-size:18px;
        }

        /* Navigation */
        nav{
            background:#ff9800;
            text-align:center;
            padding:15px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-weight:bold;
            transition:0.3s;
        }

        nav a:hover{
            color:black;
        }

        /* Container */
        .container{
            width:90%;
            margin:auto;
            padding:30px;
        }

        .logout-card{
            max-width:500px;
            margin:auto;
            background:white;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0px 4px 15px rgba(0,0,0,0.15);
        }

        .logout-card h2{
            color:#ff9800;
            margin-bottom:20px;
        }

        .logout-card p{
            font-size:18px;
            margin-bottom:20px;
        }

        .logout-btn{
            background:#dc3545;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
            font-weight:bold;
        }

        .logout-btn:hover{
            opacity:0.8;
        }

        footer{
            background:#ff9800;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:30px;
        }

        @media(max-width:768px){

            nav a{
                display:block;
                margin:10px 0;
            }

            header h1{
                font-size:30px;
            }
        }

    </style>
</head>

<body>

<header>
    <h1>🚪 Logout</h1>
    <p>Thank You for Managing Your Store</p>
</header>

<nav>
    <a href="seller-dashboard.html">Dashboard</a>
    <a href="manage-products.html">Products</a>
    <a href="add-product.html">Add Product</a>
    <a href="seller-orders.html">Orders</a>
    <a href="seller-profile.html">Profile</a>
    <a href="logout.html">Logout</a>
</nav>

<div class="container">

    <div class="logout-card">

        <h2>Logout</h2>

        <p>
            Are you sure you want to logout?
        </p>

        <a href="index.html">
            <button class="logout-btn">
                Logout
            </button>
        </a>

    </div>

</div>

<footer>
    <p>© 2026 Monkey & Banana Store | Seller Logout</p>
</footer>

</body>
</html>
